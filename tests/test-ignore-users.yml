name: Test ignore_users and allow_no_diff inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/feature-ignore
      GITHUB_HEAD_REF: feature-ignore
      GITHUB_BASE_REF: master
      GITHUB_ACTOR: dependabot
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a branch with a commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-ignore || git checkout feature-ignore
          echo "ignore-test-$(date +%s)" > ignore-test-file.txt
          git add ignore-test-file.txt
          git commit -m "ignore test commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-ignore
          target_branch: master
          title: "Ignore Users Test PR"
          body: "Testing ignore_users input"
          ignore_users: "dependabot,renovate"
          allow_no_diff: "true"

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
