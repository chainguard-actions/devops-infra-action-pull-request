name: Test ignore_users option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with ignore_users containing a known bot user
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: act-harness
          target_branch: act-harness
          title: "Test PR - ignore users"
          body: "Testing ignore_users functionality"
          ignore_users: "dependabot,github-actions[bot]"
          allow_no_diff: "true"

      - name: Assert action ran without being cancelled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
