name: Test basic PR creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create source branch with a unique commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          BRANCH="test-basic-pr-$(date +%s)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH"
          echo "test-content-$(date +%s)" > tests/basic-pr-test.txt
          git add tests/basic-pr-test.txt
          git commit -m "Test commit for basic PR"
          git push origin "$BRANCH" || echo "Push failed (expected in act environment)"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: ${{ env.BRANCH }}
          target_branch: act-harness
          title: "Basic Test PR"
          body: "Testing basic PR creation from action"
          allow_no_diff: "true"

      - name: Assert action ran and check outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_URL: ${{ steps.action.outputs.url }}
          PR_NUMBER: ${{ steps.action.outputs.pr_number }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "pr_url: $PR_URL"
          echo "pr_number: $PR_NUMBER"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
