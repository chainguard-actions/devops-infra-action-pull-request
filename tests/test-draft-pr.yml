name: Test draft pull request creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/draft-feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a dummy source branch for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b draft-feature-branch || true
          echo "draft test change" >> draft-test-file.txt
          git add draft-test-file.txt || true
          git commit -m "draft test commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: draft-feature-branch
          target_branch: master
          title: "Draft Test PR from act"
          body: "This is a draft test pull request created by act"
          draft: "true"
          label: "test,automated"
          allow_no_diff: "true"
          max_body_bytes: "65000"
          max_diff_lines: "100"

      - name: Assert action ran with draft inputs
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action may fail due to API limitations in test env,
          # but we verify it was invoked with the github_token and draft inputs covered.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with github_token and draft inputs"
