name: Test draft PR creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a feature branch with a commit
        run: |
          git checkout -b test-draft-feature-branch
          echo "test change for draft PR $(date)" > "$GITHUB_WORKSPACE/test-draft-change.txt"
          git add test-draft-change.txt
          git commit -m "test: add change for draft PR test"

      - name: Run action with draft=true
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: test-draft-feature-branch
          target_branch: act-harness
          title: "Test Draft PR"
          body: "This is a test draft PR"
          draft: "true"

      - name: Check action outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_URL: ${{ steps.action.outputs.url }}
          PR_NUMBER: ${{ steps.action.outputs.pr_number }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "pr_url: $PR_URL"
          echo "pr_number: $PR_NUMBER"
          # The action should at least run without crashing at the Docker level
          # (API failures are acceptable in test environments)
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action ran to completion with outcome=$OUTCOME"
