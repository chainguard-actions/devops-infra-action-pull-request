name: Test draft pull request creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/feature-draft
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git user
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          source_branch: feature-draft
          target_branch: master
          title: "Draft PR from act"
          body: "This is a draft pull request."
          draft: "true"
          label: "test,automation"
          allow_no_diff: "true"
        continue-on-error: true
      - name: Assert action ran without unexpected errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail because there's no real remote repo or diff,
          # but it should not fail due to missing github_token input.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
