name: Test draft pull request creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/draft-feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: draft-feature-branch
          target_branch: master
          title: "Draft PR: test draft pull request"
          body: "This is a draft pull request for testing."
          draft: "true"
          label: "test,draft"
          allow_no_diff: "true"
          max_body_bytes: "65000"
          max_diff_lines: "100"

      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action was not invoked"
            exit 1
          fi
          echo "PASS: action was invoked with draft=true and label inputs"
