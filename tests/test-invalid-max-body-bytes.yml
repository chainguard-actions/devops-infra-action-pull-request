name: Test invalid max_body_bytes fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          INPUT_MAX_BODY_BYTES: "100"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: act-harness
          target_branch: master
          max_body_bytes: "100"

      - name: Assert action failed due to invalid max_body_bytes
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when max_body_bytes < 2048, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with max_body_bytes < 2048"
