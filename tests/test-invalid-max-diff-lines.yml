name: Test invalid max_diff_lines fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          INPUT_MAX_DIFF_LINES: "not-a-number"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: act-harness
          target_branch: master
          max_diff_lines: "not-a-number"

      - name: Assert action failed due to invalid max_diff_lines
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when max_diff_lines is not a number, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with non-numeric max_diff_lines"
