name: Test absolute repository_path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          INPUT_REPOSITORY_PATH: "/etc"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository_path: "/etc"
          source_branch: act-harness
          target_branch: master

      - name: Assert action failed due to absolute repository_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with absolute repository_path, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with absolute repository_path"
