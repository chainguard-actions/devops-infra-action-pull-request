name: Test allow_no_diff and ignore_users inputs
on:
  workflow_dispatch:
jobs:
  test-allow-no-diff:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/no-diff-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a dummy git branch for the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b no-diff-branch || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: no-diff-branch
          target_branch: master
          title: "PR with no diff allowed"
          allow_no_diff: "true"
          ignore_users: "dependabot,renovate"
          max_body_bytes: "32000"
          max_diff_lines: "100"

      - name: Assert action was invoked with allow_no_diff inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should be invoked (not skipped), even if it fails due to invalid token
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, it should have been invoked"
            exit 1
          fi
          echo "PASS: action was invoked with allow_no_diff=true (outcome=$OUTCOME)"
