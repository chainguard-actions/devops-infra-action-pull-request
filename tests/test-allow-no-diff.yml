name: Test allow_no_diff input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/no-diff-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up source branch (no new commits beyond target)
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b no-diff-branch || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: no-diff-branch
          target_branch: master
          title: "No Diff Test PR"
          body: "Testing allow_no_diff flag"
          allow_no_diff: "true"

      - name: Assert action ran with allow_no_diff
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with allow_no_diff=true (outcome=$OUTCOME)"
