name: Test allow no diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: main
          target_branch: master
          title: "No Diff Test PR"
          body: "Testing allow_no_diff flag."
          allow_no_diff: "true"
          label: "test,automated"
          max_body_bytes: "65000"
          max_diff_lines: "100"
        continue-on-error: true
      - name: Assert action ran with allow_no_diff
        run: |
          echo "allow_no_diff action completed"
          echo "url output: ${{ steps.action.outputs.url }}"
          echo "pr_number output: ${{ steps.action.outputs.pr_number }}"
          echo "PASS: allow_no_diff action step executed without crashing the workflow"
