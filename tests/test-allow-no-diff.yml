name: Test allow_no_diff option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Run action with allow_no_diff=true (same branch, no diff expected)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: act-harness
          target_branch: act-harness
          title: "Test PR - allow no diff"
          body: "This is a test PR created by act"
          allow_no_diff: "true"

      - name: Assert action completed (allow_no_diff=true should not fail on no diff)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With same source and target branch (same revision), the action exits 0
          # cleanly with "Both branches are the same. No action needed."
          # This verifies the action handles the no-diff case without crashing.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
