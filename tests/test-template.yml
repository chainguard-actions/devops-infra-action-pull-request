name: Test template with string replacement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/template-feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: template-feature-branch
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a PR template file
        run: |
          mkdir -p .github
          cat > .github/pull_request_template.md << 'EOF'
          ## Summary
          PLACEHOLDER_VERSION has been updated.

          ## Changes
          - Updated version from old to new
          EOF

      - name: Set up a feature branch with a commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b template-feature-branch || git checkout template-feature-branch
          echo "template test change $(date)" > template-test-file.txt
          git add template-test-file.txt .github/pull_request_template.md
          git commit -m "Template test commit for PR" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: template-feature-branch
          target_branch: master
          title: "Template Test PR from act"
          template: ".github/pull_request_template.md"
          old_string: "PLACEHOLDER_VERSION"
          new_string: "v2.0.0"
          draft: "false"

      - name: Assert action ran with template options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action will fail because the token is fake and no real repo exists
          # but we verify it was invoked and produced an outcome
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: template action was invoked and produced outcome: $OUTCOME"
