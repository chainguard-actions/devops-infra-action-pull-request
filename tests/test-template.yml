name: Test pull request with template and diff
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/template-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a PR template file
        run: |
          mkdir -p .github
          echo "## Changes\n\nOLD_PLACEHOLDER\n\n## Diff\n" > .github/pull_request_template.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: template-branch
          target_branch: master
          title: "PR with template"
          template: ".github/pull_request_template.md"
          old_string: "OLD_PLACEHOLDER"
          new_string: "NEW_CONTENT"
          get_diff: "false"
          ignore_users: "dependabot,bot"
          allow_no_diff: "true"

      - name: Assert action was invoked with template inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action was not invoked"
            exit 1
          fi
          echo "PASS: action was invoked with template, old_string, new_string inputs"
