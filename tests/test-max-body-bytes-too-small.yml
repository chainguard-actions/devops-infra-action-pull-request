name: Test max_body_bytes below minimum causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with max_body_bytes below minimum (2048)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          source_branch: act-harness
          target_branch: nonexistent-target-branch-for-testing
          max_body_bytes: "100"
        continue-on-error: true
      - name: Assert action failed due to max_body_bytes below minimum
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when max_body_bytes=100 (below minimum 2048), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for max_body_bytes below minimum"
