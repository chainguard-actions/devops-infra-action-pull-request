name: Test no-diff behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git identity and origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a bare repo under GITHUB_WORKSPACE so it's reachable inside the container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Run action with no diff (same branch, allow_no_diff=false)
        id: action
        continue-on-error: true
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: act-harness
          target_branch: act-harness
          title: "Test PR - no diff"
          body: "This is a test PR body"
          allow_no_diff: "false"

      - name: Assert action handled no-diff gracefully
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # When there is no diff between source and target, the action should
          # either succeed (skipping PR creation) or fail with a known no-diff error.
          # Either way, it should NOT create a PR. We just verify it ran.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action completed (outcome=${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome: ${{ steps.action.outcome }}"
            exit 1
          fi
