name: Test get_diff option with max_diff_lines
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/diff-feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git identity and create diff
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b diff-feature-branch || git checkout diff-feature-branch
          # Create a file with content to produce a meaningful diff
          echo "line 1" >> diff-test-file.txt
          echo "line 2" >> diff-test-file.txt
          echo "line 3" >> diff-test-file.txt
          git add diff-test-file.txt
          git commit -m "add diff test file"

      # Test with get_diff=true and a limited max_diff_lines to verify
      # the action accepts these inputs and processes them.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: diff-feature-branch
          target_branch: master
          title: "Test PR with diff injection"
          body: "PR body with diff below"
          get_diff: "true"
          max_diff_lines: "100"
          max_body_bytes: "65000"
          allow_no_diff: "true"

      - name: Assert action was invoked
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: expected failure or success, got $OUTCOME"
            exit 1
          fi
          echo "PASS: get_diff action was invoked (outcome=$OUTCOME)"
