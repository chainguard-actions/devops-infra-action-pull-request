name: Test pull request with diff and size options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/diff-options-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a dummy source branch in git
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b diff-options-branch || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: diff-options-branch
          target_branch: master
          title: "PR with diff options"
          body: "Testing diff and size limit options."
          get_diff: "true"
          allow_no_diff: "true"
          ignore_users: "dependabot,renovate"
          max_body_bytes: "32000"
          max_diff_lines: "100"

      - name: Assert action ran with diff options
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With a fake token, we expect failure due to API auth
          # The important thing is the action was invoked and processed diff option inputs
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran to completion with diff options (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
