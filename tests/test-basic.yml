name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a dummy source branch for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-branch || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-input-coverage
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from feature-branch"
          body: "This is a test pull request body."
          draft: "false"
          allow_no_diff: "true"
          ignore_users: "dependabot"
          max_body_bytes: "65000"
          max_diff_lines: "0"

      - name: Assert action ran (input coverage check)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail in act (no real GitHub API),
          # but we verify it was invoked with the required github_token input.
          # A 'failure' outcome means the action ran and attempted the API call.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with github_token input covered"
