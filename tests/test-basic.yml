name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a feature branch for the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-branch || git checkout feature-branch

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from feature-branch"
          body: "This is a test pull request body."
          draft: "false"
          allow_no_diff: "true"
          ignore_users: "dependabot"

      - name: Assert action ran (may fail due to no real diff or API limits)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Action conclusion: ${{ steps.action.conclusion }}"
          # The action is expected to either succeed (creating a PR) or fail
          # gracefully when there's no diff or the token lacks permissions.
          # We verify the step was executed (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step was executed"
