name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/feature-branch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request body"
          draft: "false"
          allow_no_diff: "true"

      - name: Assert action ran (output or error expected)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PR URL output: ${{ steps.action.outputs.url }}"
          echo "PR number output: ${{ steps.action.outputs.pr_number }}"
          # The action may fail due to no real GitHub API in act environment,
          # but we verify it was invoked with the required inputs.
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action was invoked"
          else
            echo "FAIL: action did not run"
            exit 1
          fi
