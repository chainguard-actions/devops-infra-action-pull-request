name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from feature-branch"
          body: "This is a test pull request body."
          draft: "false"
          allow_no_diff: "true"

      - name: Assert action ran (token input was accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a fake token when calling the GitHub API,
          # but it must have been invoked (outcome is either success or failure, not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with github_token input"
