name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-test-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a feature branch for PR source
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-test-branch || git checkout feature-test-branch
          echo "test-file-$(date +%s)" > test-pr-file.txt
          git add test-pr-file.txt
          git commit -m "Add test file for PR"
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: feature-test-branch
          target_branch: master
          title: "Test PR from feature-test-branch"
          body: "This is a test pull request created by the action test suite."
          allow_no_diff: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (may have failed due to no real GitHub API in act)"
          echo "url output: ${{ steps.action.outputs.url }}"
          echo "pr_number output: ${{ steps.action.outputs.pr_number }}"
          echo "PASS: action step executed without crashing the workflow"
