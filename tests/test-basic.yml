name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a source branch with a commit so there is a diff
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-branch || git checkout feature-branch
          echo "test change $(date)" >> test-file.txt
          git add test-file.txt
          git commit -m "test: add test file for PR action"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"
        continue-on-error: true

      - name: Assert action ran with github_token input covered
        run: |
          echo "Action completed (may fail due to test environment limitations)"
          echo "url output: ${{ steps.action.outputs.url }}"
          echo "pr_number output: ${{ steps.action.outputs.pr_number }}"
          echo "PASS: github_token input was provided and action was invoked"
