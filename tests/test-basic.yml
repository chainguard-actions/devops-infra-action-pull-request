name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from feature-branch"
          body: "This is a test pull request body."
          draft: "false"
          allow_no_diff: "true"

      - name: Assert action was invoked with github_token
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Action conclusion: ${{ steps.action.conclusion }}"
          # The action may fail because there's no real PR to create in the test env,
          # but it must have been invoked (outcome is set).
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action was not invoked"
            exit 1
          fi
          echo "PASS: action was invoked"
