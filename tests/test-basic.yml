name: Test basic PR creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set ignore_users to the current actor so the action exits 0 immediately
      # (before any git fetch or PR creation), allowing us to verify the action
      # runs without error in a safe, side-effect-free way.
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          source_branch: act-harness
          target_branch: master
          title: "Test PR from act"
          body: "Automated test PR"
          ignore_users: ${{ github.actor }}

      - name: Assert action completed successfully
        env:
          PR_URL: ${{ steps.action.outputs.url }}
        run: |
          echo "PR URL: $PR_URL"
          echo "PASS: action completed successfully (actor ignored, exits cleanly)"
