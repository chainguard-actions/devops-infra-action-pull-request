name: Test basic pull request creation (no diff scenario)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a source branch for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-branch 2>/dev/null || git checkout feature-branch

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from feature-branch"
          body: "This is a test pull request body."
          allow_no_diff: "true"

      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail due to fake token, but it should have been invoked
          # We verify it ran (either success or failure is acceptable since we have no real token)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
