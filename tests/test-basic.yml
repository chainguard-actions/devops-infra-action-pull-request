name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test branches
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create a target branch from current HEAD
          git checkout -b test-target-branch
          git checkout -b test-source-branch
          # Make a small commit so there is a diff
          echo "test-$(date +%s)" > test-pr-file.txt
          git add test-pr-file.txt
          git commit -m "Test commit for PR action"

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: test-source-branch
          target_branch: test-target-branch
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"
        continue-on-error: true

      - name: Assert action ran without unexpected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail if not connected to a real GitHub repo (act environment)
          # but it must have been invoked (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
