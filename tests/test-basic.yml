name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: dummy-token-for-local-test
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/feature-branch
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a dummy source branch for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-test-branch || true
          echo "test-file-$(date +%s)" > test-dummy-file.txt
          git add test-dummy-file.txt
          git commit -m "Add dummy file for PR test" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          source_branch: feature-test-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"

      - name: Assert action was invoked with github_token
        run: |
          echo "Action step completed (may have failed due to API call with dummy token)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with a dummy token since it makes real API calls.
          # We only verify that the action was invoked (not skipped) and the input was passed.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with github_token input"
