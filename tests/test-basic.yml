name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"
        continue-on-error: true
      - name: Assert action ran with required inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "Action conclusion: ${{ steps.action.conclusion }}"
          # The action may fail due to no real GitHub API access in act,
          # but it must have been invoked (not skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with required github_token input"
