name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: feature-branch
          target_branch: main
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"
      - name: Assert action ran (output url or pr_number may be empty in test env)
        env:
          URL: ${{ steps.action.outputs.url }}
          PR_NUMBER: ${{ steps.action.outputs.pr_number }}
        run: |
          echo "url: $URL"
          echo "pr_number: $PR_NUMBER"
          echo "Action completed (API call may fail in test environment, which is expected)"
          echo "PASS: github_token input was covered"
