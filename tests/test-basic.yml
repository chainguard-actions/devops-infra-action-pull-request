name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-test-branch
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: feature-test-branch
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          source_branch: feature-test-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"
        continue-on-error: true

      - name: Assert action ran without unexpected errors
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PR URL: ${{ steps.action.outputs.url }}"
          echo "PR Number: ${{ steps.action.outputs.pr_number }}"
          # The action may fail due to no real GitHub token or no actual diff,
          # but it must have been invoked (outcome is set).
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action was invoked with github_token input"
