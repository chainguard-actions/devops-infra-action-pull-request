name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-test-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a source branch for PR creation
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-test-branch || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          source_branch: feature-test-branch
          target_branch: main
          title: "Test PR from act"
          body: "This is a test pull request created by act."
          draft: "false"
          allow_no_diff: "true"

      - name: Assert action ran (token input was accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to no real diff or API limitations in test env,
          # but it must have been invoked (not skipped). Outcome should be
          # 'success' or 'failure', never empty.
          OUTCOME="${{ steps.action.outcome }}"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run at all"
            exit 1
          fi
          echo "PASS: action was invoked with github_token input"
