name: Test basic pull request creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a local git branch so the action has something to work with
      - name: Set up git branches
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create and switch to a feature branch
          git checkout -b feature-branch || git checkout feature-branch
          # Make a commit so there is a diff vs master
          echo "test change" >> test-file.txt
          git add test-file.txt
          git commit -m "test commit for PR"

      # The action will fail at the GitHub API call stage because we don't have
      # a real token pointing to a real repo with these branches. We verify the
      # action is invoked and fails with an expected error (not a setup error).
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request body"
          draft: "false"

      - name: Assert action was invoked (outcome is failure due to invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, the action should fail (not skip or be cancelled)
          if [ "$OUTCOME" = "skipped" ] || [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: expected failure or success, got $OUTCOME"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
