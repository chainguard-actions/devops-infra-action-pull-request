name: Test basic usage with github_token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expect failure due to no real GitHub context)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-branch
          target_branch: master
          title: "Test PR"
          body: "This is a test pull request body"
          draft: "false"
          allow_no_diff: "true"

      - name: Assert action was invoked (outcome is either success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
