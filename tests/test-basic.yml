name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a source branch for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-branch || true
          echo "test content" > test-file.txt
          git add test-file.txt
          git commit -m "test commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-branch
          target_branch: master
          title: "Test PR"
          body: "This is a test pull request"
          allow_no_diff: "true"

      - name: Assert action was invoked with github_token
        run: |
          echo "Action completed (may have failed due to fake token, which is expected in test environment)"
          echo "outcome: ${{ steps.action.outcome }}"
          # The action requires github_token - verify it was passed and action ran
          # In a real environment without a valid token, the action will fail at API call
          # but it should at least start executing (not fail at input validation)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with github_token input"
