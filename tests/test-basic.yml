name: Test basic usage - create pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_REF: refs/heads/feature-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a dummy source branch
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b feature-branch || true
      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          source_branch: feature-branch
          target_branch: master
          title: "Test PR from act"
          body: "This is a test pull request body"
          allow_no_diff: "true"
        continue-on-error: true
      - name: Assert action ran (outputs present or action attempted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PR URL output: ${{ steps.action.outputs.url }}"
          echo "PR number output: ${{ steps.action.outputs.pr_number }}"
          # The action will fail to call GitHub API with a fake token,
          # but we verify it was invoked with the required inputs.
          # A non-skipped outcome means the action was called.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with github_token and other inputs"
