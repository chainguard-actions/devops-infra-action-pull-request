name: Test pull request with template and string replacement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/template-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a dummy source branch and template file
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b template-branch || true
          mkdir -p .github
          echo "## PR Description\n\nOLD_PLACEHOLDER\n\nChanges made in this PR." > .github/pull_request_template.md

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: template-branch
          target_branch: master
          title: "Template-based PR"
          template: ".github/pull_request_template.md"
          old_string: "OLD_PLACEHOLDER"
          new_string: "NEW_CONTENT"
          get_diff: "false"
          allow_no_diff: "true"

      - name: Assert action ran with template inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With a fake token, we expect failure due to API auth
          # The important thing is the action was invoked and processed template inputs
          if [ "${{ steps.action.outcome }}" = "success" ] || [ "${{ steps.action.outcome }}" = "failure" ]; then
            echo "PASS: action ran to completion with template inputs (outcome: ${{ steps.action.outcome }})"
          else
            echo "FAIL: unexpected outcome '${{ steps.action.outcome }}'"
            exit 1
          fi
