name: Test pull request with template string replacement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token-for-testing
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/template-feature-branch
      GITHUB_HEAD_REF: template-feature-branch
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a source branch for testing
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b template-feature-branch 2>/dev/null || git checkout template-feature-branch

      - name: Create a PR template file
        run: |
          mkdir -p .github
          cat > .github/pull_request_template.md << 'EOF'
          ## Summary
          {{OLD_STRING}}

          ## Changes
          - Updated feature
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: template-feature-branch
          target_branch: master
          title: "Template PR: Test feature"
          template: ".github/pull_request_template.md"
          old_string: "{{OLD_STRING}}"
          new_string: "This is the new description after replacement."
          allow_no_diff: "true"

      - name: Assert action was invoked with template replacement inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action will fail due to fake token, but it should have been invoked
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with template and string replacement (outcome: ${{ steps.action.outcome }})"
