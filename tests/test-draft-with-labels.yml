name: Test draft PR with labels and assignee
on:
  workflow_dispatch:
jobs:
  test-draft-with-labels:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-draft
      GITHUB_EVENT_NAME: push
      GITHUB_HEAD_REF: feature-draft
      GITHUB_BASE_REF: master
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git branch context
        run: |
          git checkout -b feature-draft 2>/dev/null || git checkout feature-draft

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: feature-draft
          target_branch: master
          title: "Draft PR with labels"
          body: "This is a draft pull request with labels."
          draft: "true"
          label: "bug,enhancement"
          assignee: "testuser"
          reviewer: "revieweruser"
          max_body_bytes: "65000"
          max_diff_lines: "100"

      - name: Assert action ran with draft and label inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # With a fake token, the action will fail at API stage but should accept all inputs
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with draft=true and labels (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
