name: Test invalid repository format fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          INPUT_REPOSITORY: "not-a-valid-repo-format"
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repository: "not-a-valid-repo-format"
          source_branch: act-harness
          target_branch: master

      - name: Assert action failed due to invalid repository format
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid repository format, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid repository format"
