name: Test PR with custom body (ignore_users early exit)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          source_branch: act-harness
          target_branch: master
          title: "[Test] Custom body PR"
          body: |
            ## Summary
            This PR was created by the act test suite to verify custom body support.

            ## Changes
            - Test change 1
            - Test change 2
          ignore_users: ${{ github.actor }}

      - name: Assert action completed successfully via ignore_users early exit
        run: |
          echo "Action completed without error (exited early: user is ignored)"
          echo "PASS"
