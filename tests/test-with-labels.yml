name: Test pull request with labels and assignees
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/labeled-feature
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a source branch for the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b labeled-feature || true
      - id: action
        uses: .
        with:
          github_token: fake-token-for-testing
          source_branch: labeled-feature
          target_branch: master
          title: "Labeled Test PR"
          body: "This PR has labels and assignees"
          label: "bug,enhancement"
          assignee: "testuser"
          allow_no_diff: "true"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: labeled PR action ran (outcome: ${{ steps.action.outcome }})"
