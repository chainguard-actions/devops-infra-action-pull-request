name: Test labels and assignees input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/label-test-branch
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up source branch with changes
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git checkout -b label-test-branch || true
          echo "label test change" >> label-test-file.txt
          git add label-test-file.txt
          git commit -m "label test commit" || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          source_branch: label-test-branch
          target_branch: master
          title: "Label Test PR"
          body: "Testing labels and assignees"
          label: "bug,enhancement"
          assignee: "testuser"
          create_missing_labels: "true"
          allow_no_diff: "true"

      - name: Assert action ran with label and assignee inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with label and assignee inputs (outcome=$OUTCOME)"
